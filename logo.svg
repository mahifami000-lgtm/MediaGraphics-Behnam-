<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0D12"/>
      <stop offset="100%" stop-color="#161822"/>
    </linearGradient>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="gGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="492" height="492" rx="90" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.6"/>

  <!-- Inner Shutter / Aperture Circle -->
  <circle cx="256" cy="245" r="160" fill="#1A1D28" stroke="#282C3D" stroke-width="4"/>
  <circle cx="256" cy="245" r="145" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="16 10" filter="url(#glow)"/>

  <!-- Monogram MGB -->
  <g transform="translate(110, 180)">
    <!-- M -->
    <path d="M 10 110 L 10 15 L 45 65 L 80 15 L 80 110" fill="none" stroke="url(#mGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- G -->
    <path d="M 175 45 C 160 20 120 20 110 55 C 100 90 135 110 165 105 C 178 100 180 85 180 75 L 145 75" fill="none" stroke="url(#gGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- B -->
    <path d="M 215 15 L 215 110 M 215 15 L 250 15 C 275 15 275 60 250 60 L 215 60 M 215 60 L 255 60 C 285 60 285 110 255 110 L 215 110" fill="none" stroke="url(#bGrad)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Subtitle line -->
  <rect x="130" y="340" width="252" height="3" rx="1.5" fill="#282C3D"/>
  <text x="256" y="375" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="4" text-anchor="middle">MEDIA GRAPHICS BEHNAM</text>
  <text x="256" y="405" fill="#64748B" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="2" text-anchor="middle">PROJECT WORKFLOW SYSTEM</text>
</svg>
